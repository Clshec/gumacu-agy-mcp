# Review/testing profile, not installed in the user's global Codex configuration.
# The /tmp runtime is temporary; replace it with an approved durable install
# before relying on this configuration across server reboots.
[mcp_servers.gumacu_netcup]
command = 'C:\Windows\System32\OpenSSH\ssh.exe'
args = [
  "-T", "-o", "BatchMode=yes", "-o", "StrictHostKeyChecking=yes",
  "نيت كيب سيرفر",
  "env GUMACU_REMOTE_PROFILE=controlled GUMACU_ALLOWED_WORKSPACE=/tmp/gumacu-agy-review.WyP04n3d/workspace AGY_MCP_SESSION_ROOT=/tmp/gumacu-agy-review.WyP04n3d/live-sessions /tmp/gumacu-agy-review.WyP04n3d/venv/bin/python -m agy_mcp.cli",
]
startup_timeout_sec = 30
tool_timeout_sec = 180

# Windows OpenSSH requires PROGRAMDATA even when an MCP client's default
# child environment omits it. This is a directory path, not a credential.
[mcp_servers.gumacu_netcup.env]
PROGRAMDATA = 'C:\ProgramData'

[project]
name = "alf-control"
version = "0.2.0"
description = "Direct ChatGPT MCP control of authorized servers and devices across providers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Gumacu" }]
keywords = ["mcp", "chatgpt", "ssh", "windows", "devices", "multi-provider"]
dependencies = ["mcp[cli]>=1.21.2,<2", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
alf-control = "alf_control.cli:main"
alf-control-doctor = "alf_control.doctor:main"
agymcp = "alf_control.cli:main"
agy-doctor = "alf_control.doctor:main"

[project.urls]
Repository = "https://github.com/Clshec/gumacu-agy-mcp"
Issues = "https://github.com/Clshec/gumacu-agy-mcp/issues"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alf_control", "src/agy_mcp"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src", "integrations/windows-mcp", "deploy", "docs", "scripts", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", "uv.lock", "plugin.json", ".codex-plugin/plugin.json", ".app.json"]
exclude = ["**/.venv", "**/.venv/**", "**/__pycache__", "**/*.pyc", "**/backends.json", "docs/internal-*", "docs/private-*", "docs/audit-*", "docs/reference-review.md", "docs/review-followups.md", "docs/local-test-checklist.md", "**/.env", "**/.env.*", "**/*.pem", "**/*.key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error", "ignore::DeprecationWarning:pytest_asyncio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501", "B008", "B904"]

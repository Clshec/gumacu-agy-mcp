name: ChatGPT MCP client refresh release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-mcp-client-refresh-gate
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ChatGPT MCP release checklist and summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const shortSha = sha ? sha.substring(0, 7) : "unknown";
            const guide = `https://github.com/${owner}/${repo}/blob/main/docs/chatgpt-mcp-client-refresh.md`;
            const release = `https://github.com/${owner}/${repo}/commit/${sha}`;

            await core.summary
              .addHeading("🚀 ChatGPT MCP Client Refresh & Release Gate", 2)
              .addRaw(`**Release Commit:** [${shortSha}](${release})\n\n`)
              .addRaw(`> [!IMPORTANT]\n> ChatGPT may retain an approved/frozen MCP action snapshot. Restarting the tunnel or server does not guarantee client refresh. Verify client tool visibility in a **new chat session** after updating.\n\n`)
              .addHeading("📋 Acceptance Checklist", 3)
              .addRaw([
                "- [ ] **Runtime SHA:** Verify deployed commit on host matches released SHA",
                "- [ ] **Production MCP Endpoint:** Run `tools/list` on host endpoint to confirm 26+ tools exposed",
                "- [ ] **Windows Tunnel:** If ChatGPT still shows legacy tools, terminate stale `tunnel-client.exe`/`ssh.exe` and re-run starter script",
                "- [ ] **Client Snapshot:** Update/refresh actions in ChatGPT App Settings if needed and start a new chat",
                "- [ ] **Tool Visibility:** Confirm `agy_devices` and multi-device tools are visible to ChatGPT",
                "- [ ] **Windows E2E & Telegram:** Confirm remote task execution and Telegram notification delivery"
              ].join("\n"))
              .addRaw(`\n\n📖 **Release Runbook:** [docs/chatgpt-mcp-client-refresh.md](${guide})\n`)
              .write();

name: ChatGPT MCP client refresh release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-mcp-client-refresh-gate
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ChatGPT MCP release checklist and summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const shortSha = sha ? sha.substring(0, 7) : "unknown";
            const guide = `https://github.com/${owner}/${repo}/blob/main/docs/chatgpt-mcp-client-refresh.md`;
            const release = `https://github.com/${owner}/${repo}/commit/${sha}`;

            await core.summary
              .addHeading("🚀 ChatGPT MCP Client Refresh & Release Gate", 2)
              .addRaw(`**Release Commit:** [${shortSha}](${release})\n\n`)
              .addRaw(`> [!IMPORTANT]\n> Deploy/reload MCP, then use Settings → Plugins → netcup → Refresh tools for changed definitions. Verify callable inventory and native invocation in the existing conversation; a new conversation is a fallback. Readiness or UI visibility alone is insufficient.\n\n`)
              .addHeading("📋 Acceptance Checklist", 3)
              .addRaw([
                "- [ ] **Runtime SHA:** Verify deployed commit on host matches released SHA",
                "- [ ] **Production MCP Endpoint:** Verify expected names/schemas with `tools/list`, including `agy_capabilities` and `agy_dispatch`",
                "- [ ] **Windows Tunnel:** Reload only the managed gumacu-netcup runtime when needed; preserve jobs, agent SSH and the independent Telegram poller",
                "- [ ] **Client Snapshot:** Refresh netcup tool definitions in ChatGPT settings, allow inventory propagation and recheck",
                "- [ ] **Tool Visibility:** Invoke `agy_capabilities` and `agy_dispatch` through the assistant's native connector; SSH or UI checks alone do not count",
                "- [ ] **Windows E2E & Telegram:** Confirm remote task execution and Telegram notification delivery"
              ].join("\n"))
              .addRaw(`\n\n📖 **Release Runbook:** [docs/chatgpt-mcp-client-refresh.md](${guide})\n`)
              .write();

name: Multi-device Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-device:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - run: uv run --python 3.12 pytest -q tests/test_device_gateway.py
      - run: uv run --python 3.12 python -m agy_mcp.device_agent --help
      - run: uv run --python 3.12 python -m agy_mcp.device_gateway --help
